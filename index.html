<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria Study</title>
  <meta name="description" content="Personal knowledge management and English learning application.">
  <link rel="stylesheet" href="css/style.css">
  <!-- Adobe Typekit (hirotos.com inspiration) -->
  <link rel="stylesheet" href="https://use.typekit.net/nof0axs.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Configure marked: single line break → <br>, GFM tables/task lists/etc.
    marked.setOptions({ breaks: true, gfm: true });
  </script>
</head>
<body>

  <!-- ========== Top Bar ========== -->
  <header class="top-bar" id="top-bar">
    <div class="top-bar-brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">Aria Study</span>
    </div>
    <div class="top-bar-actions">
      <button class="top-bar-btn" onclick="exportData()" title="Export">💾</button>
      <button class="top-bar-btn" onclick="importData()" title="Import">📂</button>
    </div>
  </header>

  <!-- ========== Main Content ========== -->
  <main class="main-content" id="main-content">
    <div id="dynamic-content">
      <div class="page-center">
        <div class="loading-spinner">
          <div class="spinner-ring"></div>
          <p>Loading</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ========== Floating Bottom Navigation ========== -->
  <nav class="float-nav" id="float-nav">
    <button class="nav-btn active" data-page="home" title="Home">
      <span class="nav-icon">✦</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-page="knowledge" title="Knowledge">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Notes</span>
    </button>
    <button class="nav-btn" data-page="dictionary" title="Dictionary">
      <span class="nav-icon">📖</span>
      <span class="nav-label">Dict</span>
    </button>
    <button class="nav-btn" data-page="wordlist" title="Words">
      <span class="nav-icon">📝</span>
      <span class="nav-label">Words</span>
    </button>
    <button class="nav-btn" data-page="quiz" title="Quiz">
      <span class="nav-icon">✍️</span>
      <span class="nav-label">Quiz</span>
    </button>
    <button class="nav-btn" data-page="progress" title="Progress">
      <span class="nav-icon">📈</span>
      <span class="nav-label">Stats</span>
    </button>
    <button class="nav-btn" data-page="linking" title="Linking">
      <span class="nav-icon">🔗</span>
      <span class="nav-label">Link</span>
    </button>
    <button class="nav-btn" data-page="speaking" title="Speaking">
      <span class="nav-icon">🎤</span>
      <span class="nav-label">Speak</span>
    </button>
    <button class="nav-btn" data-page="translate" title="Translate">
      <span class="nav-icon">🌐</span>
      <span class="nav-label">Trans</span>
    </button>
  </nav>

  <!-- ========== Modal ========== -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h3>Title</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <!-- Dynamic body -->
      </div>
      <div class="modal-footer">
        <!-- Dynamic footer -->
      </div>
    </div>
  </div>

  <!-- ========== Toast Container ========== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ========== Data Import (hidden file input) ========== -->
  <input type="file" id="import-file-input" accept=".json" style="display:none;">

  <!-- ========== Scripts ========== -->
  <script src="js/storage.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/english.js"></script>
  <script src="js/app.js"></script>

  <!-- ========== Data Export/Import Functions ========== -->
  <script>
    function exportData() {
      const data = {
        notes: STORAGE.getNotes(),
        words: STORAGE.getWords(),
        quizzes: STORAGE.getQuizzes(),
        exportDate: new Date().toISOString(),
        version: '1.0',
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AriaStudy-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Data exported ✅');
    }

    function importData() {
      document.getElementById('import-file-input').click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('import-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);

            if (!data.notes && !data.words) {
              showToast('Invalid backup file', 'error');
              return;
            }

            let imported = 0;
            if (data.notes && Array.isArray(data.notes)) {
              STORAGE.saveNotes(data.notes);
              imported += data.notes.length;
            }
            if (data.words && Array.isArray(data.words)) {
              STORAGE.saveWords(data.words);
              imported += data.words.length;
            }
            if (data.quizzes && Array.isArray(data.quizzes)) {
              STORAGE.saveQuizzes(data.quizzes);
            }

            showToast(`Imported ${imported} records ✅`);
            APP.navigateTo(APP.getCurrentPage());
          } catch (err) {
            showToast('Import failed: invalid format', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
    });
  </script>
</body>
</html>
